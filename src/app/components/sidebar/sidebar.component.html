<aside [class.w-56]="!isCollapsed" [class.w-16]="isCollapsed"
  class="h-screen bg-slate-900 flex flex-col sticky left-0 top-0 z-50 transition-all duration-300 border-r border-slate-800">

  <div class="flex flex-col h-full py-5 gap-6 w-full overflow-hidden" [ngClass]="isCollapsed ? 'px-2 items-center' : 'px-3'">

    <div class="flex items-center h-10 w-full" [ngClass]="isCollapsed ? 'justify-center px-0' : 'justify-between px-1'">

      @if (!isCollapsed) {
      <div class="flex flex-col animate-fade-in">
        <span class="text-xl font-black italic tracking-tighter text-[#59ee50] leading-none">{{ logoText }}</span>
        <span class="text-[0.6rem] font-bold tracking-[0.15em] text-slate-400 leading-none mt-1.5 uppercase">{{
          subtitleText }}</span>
      </div>
      }

      <button type="button" (click)="toggleSidebar()"
        class="p-1.5 text-slate-400 hover:bg-slate-800 hover:text-white rounded-lg transition-colors flex items-center justify-center w-9 h-9">
        <span class="material-symbols-outlined text-[22px] leading-none">{{ isCollapsed ? 'menu_open' : 'menu' }}</span>
      </button>
    </div>

    <div class="w-full" [ngClass]="isCollapsed ? 'flex justify-center' : 'px-0.5'">
      <button [routerLink]="reservaRoute"
        [ngClass]="isCollapsed ? 'w-10 h-10 p-0' : 'w-full py-2.5 gap-2'"
        class="flex items-center justify-center bg-gradient-to-r from-[#006b0a] to-[#59ee50] text-[#003e03] font-bold rounded-lg shadow-lg hover:scale-[1.02] transition-all">
        <span class="material-symbols-outlined text-[20px] leading-none">add_circle</span>
        @if (!isCollapsed) {
        <span class="text-xs whitespace-nowrap uppercase tracking-wider">{{ buttonText }}</span>
        }
      </button>
    </div>

    <nav class="flex-grow flex flex-col gap-1.5 w-full overflow-y-auto overflow-x-hidden custom-scrollbar"
      [class.items-center]="isCollapsed">
      @for (item of menuItems; track item.route) {
      <a [routerLink]="item.route" routerLinkActive #rla="routerLinkActive"
        [ngClass]="[
          rla.isActive ? activeClass : inactiveClass,
          isCollapsed ? 'justify-center w-10 h-10 px-0 py-0' : 'w-full gap-3 px-3 py-2.5'
        ]"
        class="cursor-pointer flex items-center rounded-lg transition-all duration-300"
        [title]="isCollapsed ? item.label : ''">

        <span class="material-symbols-outlined text-[22px] leading-none flex items-center justify-center">{{ item.icon }}</span>

        @if (!isCollapsed) {
        <span class="text-sm font-medium whitespace-nowrap">
          {{ item.label }}
        </span>
        }
      </a>
      }
    </nav>

    <button routerLink="/"
      [ngClass]="isCollapsed ? 'justify-center w-10 h-10 px-0 py-0' : 'w-full gap-3 px-3 py-2.5'"
      class="flex items-center text-white font-semibold hover:bg-white/10 transition-all rounded-lg"
      [title]="isCollapsed ? 'Volver' : ''">
      <span class="material-symbols-outlined text-[22px] leading-none flex items-center justify-center">arrow_back</span>
      @if (!isCollapsed) {
      <span class="text-sm whitespace-nowrap">Volver</span>
      }
    </button>

    <div class="mt-auto pt-4 flex flex-col gap-3 border-t border-slate-800 w-full"
      [class.items-center]="isCollapsed">
      <div class="flex items-center bg-slate-800/40 rounded-xl overflow-hidden"
        [ngClass]="isCollapsed ? 'justify-center w-10 h-10 p-0.5' : 'w-full gap-2.5 px-1.5 py-1.5'">
        <img [src]="currentUserImage" class="w-9 h-9 min-w-[36px] rounded-lg object-cover" alt="Usuario">
        @if (!isCollapsed) {
        <div class="flex flex-col truncate">
          <span class="text-xs font-bold text-white truncate">{{ currentUserName }}</span>
          <span class="text-[0.65rem] text-slate-400 truncate">{{ currentUserEmail }}</span>
        </div>
        }
      </div>

      <button (click)="authService.logout()" routerLink="/"
        [ngClass]="isCollapsed ? 'justify-center w-10 h-10 px-0 py-0' : 'w-full gap-3 px-3 py-2.5'"
        class="flex items-center text-red-400 font-semibold hover:bg-red-500/10 transition-all rounded-lg"
        [title]="isCollapsed ? 'Cerrar Sesión' : ''">
        <span class="material-symbols-outlined text-[22px] leading-none flex items-center justify-center">logout</span>
        @if (!isCollapsed) {
        <span class="text-sm whitespace-nowrap">Cerrar Sesión</span>
        }
      </button>
    </div>
  </div>
</aside>
