<div class="w-full space-y-6">
  <form class="space-y-5" [formGroup]="loginForm" (ngSubmit)="onSubmit()">

    <!-- Campo Correo Electrónico -->
    <div class="space-y-1.5">
      <label
        class="block text-xs font-extrabold uppercase tracking-wider px-0.5 transition-colors"
        for="email"
        [ngClass]="isValidField('email') ? 'text-red-500' : 'text-slate-600 dark:text-slate-300'">
        Correo Electrónico
      </label>

      <div class="relative group">
        <span
          class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-[20px] transition-colors pointer-events-none"
          [ngClass]="isValidField('email') ? 'text-red-500' : 'text-slate-400 group-focus-within:text-primary'">
          mail
        </span>

        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="nombre@ejemplo.com"
          autocomplete="email"
          class="w-full pl-12 pr-4 py-3 bg-slate-50/80 dark:bg-slate-800/60 focus:bg-white dark:focus:bg-slate-800 border rounded-2xl text-sm font-medium text-slate-900 dark:text-white placeholder:text-slate-400 outline-none transition-all duration-200 shadow-sm"
          [ngClass]="isValidField('email')
            ? 'border-red-400 bg-red-50/50 focus:border-red-500 focus:ring-4 focus:ring-red-500/15'
            : 'border-slate-200/90 dark:border-slate-700 hover:border-slate-300 focus:border-primary focus:ring-4 focus:ring-primary/15'" />
      </div>

      @if (isValidField('email')) {
        <div class="flex items-center gap-1.5 text-xs font-semibold text-red-500 px-1 pt-0.5 animate-fade-in">
          <span class="material-symbols-outlined text-[15px]">error</span>
          <span>{{ getFieldError('email') }}</span>
        </div>
      }
    </div>

    <!-- Campo Contraseña -->
    <div class="space-y-1.5">
      <label
        class="block text-xs font-extrabold uppercase tracking-wider px-0.5 transition-colors"
        for="password"
        [ngClass]="isValidField('password') ? 'text-red-500' : 'text-slate-600 dark:text-slate-300'">
        Contraseña
      </label>

      <div class="relative group">
        <span
          class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-[20px] transition-colors pointer-events-none"
          [ngClass]="isValidField('password') ? 'text-red-500' : 'text-slate-400 group-focus-within:text-primary'">
          lock
        </span>

        <input
          id="password"
          [type]="showPassword ? 'text' : 'password'"
          formControlName="password"
          placeholder="••••••••"
          autocomplete="current-password"
          class="w-full pl-12 pr-12 py-3 bg-slate-50/80 dark:bg-slate-800/60 focus:bg-white dark:focus:bg-slate-800 border rounded-2xl text-sm font-medium text-slate-900 dark:text-white placeholder:text-slate-400 outline-none transition-all duration-200 shadow-sm"
          [ngClass]="isValidField('password')
            ? 'border-red-400 bg-red-50/50 focus:border-red-500 focus:ring-4 focus:ring-red-500/15'
            : 'border-slate-200/90 dark:border-slate-700 hover:border-slate-300 focus:border-primary focus:ring-4 focus:ring-primary/15'" />

        <button
          (click)="togglePasswordVisibility()"
          type="button"
          class="absolute right-3 top-1/2 -translate-y-1/2 p-1.5 rounded-xl text-slate-400 hover:text-slate-700 hover:bg-slate-100 dark:hover:bg-slate-700 transition-all cursor-pointer flex items-center justify-center"
          [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
          <span class="material-symbols-outlined text-[20px]">
            {{ showPassword ? 'visibility_off' : 'visibility' }}
          </span>
        </button>
      </div>

      <div class="flex items-start justify-between gap-2 px-0.5 pt-0.5">
        @if (isValidField('password')) {
          <div class="flex items-center gap-1.5 text-xs font-semibold text-red-500 animate-fade-in">
            <span class="material-symbols-outlined text-[15px]">error</span>
            <span>{{ getFieldError('password') }}</span>
          </div>
        }
        <a class="ml-auto shrink-0 text-xs font-bold text-primary hover:text-[#1e8e1e] hover:underline transition-colors" href="#">
          ¿Olvidaste tu contraseña?
        </a>
      </div>
    </div>

    <!-- Mantener sesión -->
    <div class="flex items-center justify-between pt-0.5 px-0.5">
      <label class="inline-flex items-center gap-2.5 cursor-pointer select-none group" for="remember">
        <input
          id="remember"
          type="checkbox"
          class="w-4 h-4 rounded-md border-slate-300 text-primary focus:ring-primary/30 cursor-pointer transition-all" />
        <span class="text-xs sm:text-sm font-medium text-slate-600 dark:text-slate-300 group-hover:text-slate-900 transition-colors">
          Mantener sesión iniciada
        </span>
      </label>
    </div>

    <!-- Botón Principal CTA -->
    <button
      type="submit"
      [disabled]="isPosting() || isGooglePosting()"
      class="group relative w-full py-3.5 px-6 bg-gradient-to-r from-primary via-[#1f9d27] to-primary-dim hover:brightness-110 text-white font-headline font-bold text-sm sm:text-base rounded-2xl shadow-lg shadow-primary/25 hover:shadow-xl hover:shadow-primary/35 active:scale-[0.99] transition-all duration-200 flex items-center justify-center gap-2 disabled:opacity-70 disabled:cursor-not-allowed">
      @if (!isPosting()) {
        <span>ACCEDER A LA CANCHA</span>
        <span class="material-symbols-outlined text-[20px] transition-transform duration-200 group-hover:translate-x-1">
          arrow_forward
        </span>
      } @else {
        <span class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
        <span>VERIFICANDO ACCESO...</span>
      }
    </button>
  </form>

  <!-- Separador y Acceso Social -->
  <div class="space-y-4 pt-1">
    <div class="relative flex items-center justify-center">
      <div class="w-full border-t border-slate-200 dark:border-slate-700/80"></div>
      <span class="relative bg-white dark:bg-slate-900 px-4 text-[11px] font-extrabold uppercase tracking-widest text-slate-400 whitespace-nowrap">
        O continúa con
      </span>
      <div class="w-full border-t border-slate-200 dark:border-slate-700/80"></div>
    </div>

    <button
      type="button"
      (click)="onGoogleLogin()"
      [disabled]="isPosting() || isGooglePosting()"
      class="w-full flex items-center justify-center gap-3 py-3 px-5 bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700/80 border border-slate-200/90 dark:border-slate-700 rounded-2xl shadow-sm hover:shadow transition-all active:scale-[0.99] disabled:opacity-70 disabled:cursor-not-allowed cursor-pointer">
      @if (!isGooglePosting()) {
        <img
          src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg"
          alt="Google"
          class="w-5 h-5" />
        <span class="text-sm font-bold text-slate-700 dark:text-slate-200">
          Continuar con Google
        </span>
      } @else {
        <span class="w-5 h-5 border-2 border-slate-300 border-t-primary rounded-full animate-spin"></span>
        <span class="text-sm font-bold text-slate-700 dark:text-slate-200">
          Conectando con Google...
        </span>
      }
    </button>
  </div>
</div>
