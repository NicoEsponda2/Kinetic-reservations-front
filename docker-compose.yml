name: kinetic-reservations-front

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: kinetic-reservations-front
    restart: unless-stopped
    ports:
      - "4200:4200"
    volumes:
      - .:/app
      - kinetic_front_node_modules:/app/node_modules
      - kinetic_front_angular_cache:/app/.angular
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true

volumes:
  kinetic_front_node_modules:
    name: kinetic-front-node-modules
  kinetic_front_angular_cache:
    name: kinetic-front-angular-cache
